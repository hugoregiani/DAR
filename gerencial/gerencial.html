<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EARL — Gerencial</title>
<style>
:root{--red:#CC0000;--red-dk:#961B24;--ink:#2A2F30;--ink-2:#4D545A;--ink-3:#6B7378;--line:#E2E5E7;--line-2:#D4DADD;--bg:#ECEFF0;--card:#fff;--soft:#F4F5F6;--ok:#304220;--ok-bg:#F1F5EC;--warn:#6B4E0E;--warn-bg:#FBF4E4}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Univers","Helvetica Neue",Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hdr{background:var(--red);color:#fff;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px}
.hdr img{height:30px;display:block}
.hdr .rule{width:1px;height:34px;background:rgba(255,255,255,.55)}
.hdr .tit{font-size:16px;font-weight:300;letter-spacing:.04em;white-space:nowrap}
.hdr .sp{flex:1}
.hdr .ver{font-size:11px;opacity:.85;white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 40px}
.bar{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bar .info{font-size:12.5px;color:var(--ink-2)}
.sp{flex:1}
.btn-r,.btn-o{border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{background:#B92031}
.btn-o{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn-o:hover{border-color:var(--ink-3)}
.btn-r:disabled,.btn-o:disabled{opacity:.5;cursor:default}
.btn-x{border:1px solid var(--line-2);background:#fff;border-radius:999px;width:26px;height:26px;cursor:pointer;font-weight:700;line-height:1}
h1{font-size:40px;font-weight:300;margin:26px 0 2px;position:relative;padding-left:4px}
h1:before{content:"";position:absolute;left:-22px;top:-12px;width:18px;height:18px;border-left:3px solid var(--red);border-top:3px solid var(--red)}
.sub{color:var(--ink-2);margin:0 0 16px}
.drop{border:2px dashed var(--line-2);border-radius:20px;background:#fff;padding:34px 20px;text-align:center;color:var(--ink-2);margin-top:14px}
.drop.on{border-color:var(--red);background:#FFF7F7}
.drop b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.drop ol{text-align:left;display:inline-block;margin:12px auto 0;font-size:13px;line-height:1.7}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:14px 0 6px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select{border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;background:#fff;min-width:0}
.f select{max-width:240px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.kpi{container-type:inline-size}
.kpi b{font-size:22px;font-size:min(22px,10.5cqi);font-weight:600;white-space:nowrap}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-2)}
.kpi.dest{background:linear-gradient(150deg,#D71F34 0%,#CC0000 46%,#961B24 100%);border-color:transparent;color:#fff}
.kpi.dest span,.kpi.dest em{color:rgba(255,255,255,.85)}
.tabs{display:flex;gap:2px;background:rgba(42,47,48,.06);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.card{background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);background:var(--soft);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line-2)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#FAFBFB}
.barra{height:8px;border-radius:999px;background:#E8EAEC;overflow:hidden;min-width:70px}
.barra i{display:block;height:100%;border-radius:999px;background:#43494E}
.barra i.r{background:var(--red)}
.pct{display:flex;align-items:center;gap:8px}
.pct span{font-size:11.5px;white-space:nowrap}
.neg{color:var(--red);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-ho{background:var(--warn-bg);color:var(--warn)}
.t-pl{background:var(--soft);color:var(--ink-2)}
.t-old{background:#FBEFEF;color:var(--red-dk)}
.vazio{color:var(--ink-3);font-style:italic;padding:8px 0}
.aviso{background:var(--warn-bg);border:1px solid #EEDDB4;color:var(--warn);border-radius:12px;padding:8px 12px;font-size:12.5px;margin:8px 0}
.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;z-index:50;max-width:92vw}
.msg.err{background:var(--red)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer}
details.ajuda{margin-top:10px;font-size:13px;color:var(--ink-2)}
details.ajuda summary{cursor:pointer;font-weight:700;color:var(--ink)}
.t-ops td{white-space:nowrap}
.sub2{font-size:11px;color:var(--ink-3);font-weight:400}
.nota{font-size:12px;color:var(--ink-3);margin:8px 0 0}
tr.fora td{color:var(--ink-3)}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.card-h h2{margin:0;flex:1}
.g-card{margin-bottom:14px}
.g-ctl{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.g-ctl select{border:1px solid var(--line-2);border-radius:10px;padding:5px 8px;background:#fff;font:inherit;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:400}
.g-ocultar,.g-mostrar{font-size:12px;padding:5px 10px}
.g-leg i.g-lk,.g-tl i.g-lk{width:16px;height:0;border-radius:0;border-top:2px solid var(--ink);background:transparent!important}
.g-leg i.g-lk.tr,.g-tl i.g-lk.tr{border-top-style:dashed}
.g-tend{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.g-tend.tr{stroke-dasharray:6 5}
.g-tdot{fill:var(--ink);stroke:#fff;stroke-width:2;pointer-events:none}
.vis-tg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.vis-tg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.vis-tg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.g-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:2px 0 8px}
.g-leg span{display:inline-flex;align-items:center;gap:6px}
.g-leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.graf{position:relative;min-height:310px}
.g-svg{display:block;overflow:visible}
.g-grade{stroke:var(--line);stroke-width:1}
.g-grade.base{stroke:var(--line-2)}
.g-ty{font-size:11px;fill:var(--ink-3);text-anchor:end}
.g-un{font-weight:700}
.g-tx{font-size:11px;fill:var(--ink-3);text-anchor:middle}
.g-mes,.g-cli{cursor:pointer;outline:none}
.g-cli:hover .g-bg,.g-cli:focus .g-bg,.g-cli.on .g-bg{fill:#F1F2F3}
.g-cli:focus-visible .g-bg{stroke:var(--ink-3);stroke-width:1}
.g-cy{font-size:12px;fill:var(--ink-2);text-anchor:end}
.g-cli.on .g-cy{fill:var(--ink);font-weight:700}
.g-vl{font-size:11.5px;fill:var(--ink);font-weight:600}
.g-modos button{font-size:12px;padding:5px 10px}
.g-bg{fill:transparent}
.g-mes:hover .g-bg,.g-mes:focus .g-bg{fill:#F1F2F3}
.g-mes:focus-visible .g-bg{stroke:var(--ink-3);stroke-width:1}
.g-tip{position:absolute;display:none;pointer-events:none;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:200px;z-index:5}
.g-tt{font-weight:700;margin-bottom:4px;color:var(--ink)}
.g-tl{display:flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.7}
.g-tl i{width:12px;height:2px;border-radius:1px;display:inline-block}
.g-tl b{color:var(--ink)}
.g-tl span{color:var(--ink-3)}
.dd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px}
.dd-l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.dd-ate{display:inline-flex;gap:4px;flex-wrap:wrap}
.dd-ate .btn-o{font-size:12px;padding:5px 10px}
.dd-tw{display:inline-block;width:16px;color:var(--ink-3);font-size:11px}
tr.fora td b{color:var(--ink-3)}
.t-mx{width:auto;min-width:100%;font-size:12px}
.mx-wrap{overflow:auto}
.t-mx thead{position:sticky;top:0;z-index:3}
.t-mx th{text-align:center;padding:5px 8px}
.t-mx th.n{text-align:right}
.t-mx td{padding:4px 8px;white-space:nowrap}
.t-mx .mx-rot{position:sticky;left:0;z-index:2;background:#fff;text-align:left;min-width:230px;max-width:360px;white-space:normal;box-shadow:1px 0 0 var(--line-2)}
.t-mx th.mx-rot{background:var(--soft);z-index:4;vertical-align:bottom}
.t-mx .mx-ini{border-left:1px solid var(--line-2)}
.t-mx th.mx-tri{color:var(--ink);font-size:11px}
.t-mx .mx-q{background:#EAF3E4}
.t-mx th.mx-q{background:#DDEBD3;color:var(--ok)}
.t-mx .mx-t{background:#F1F2F3;font-weight:600}
.t-mx th.mx-t{background:#E4E7E9;color:var(--ink)}
.t-mx td.mx-c{color:var(--red-dk)}
.t-mx tr.mx-g{cursor:pointer}
.t-mx tr.mx-g:hover td{background:#FAFBFB}
.t-mx tr.mx-g:hover td.mx-q{background:#E1EEDA}
.t-mx tr.mx-n0 td{background:#F6F7F8;font-weight:700}
.t-mx tr.mx-n0 td.mx-q{background:#E1EEDA}
.t-mx tr.mx-n0 td.mx-rot{background:#F6F7F8}
.t-mx tr.mx-g.on > td.mx-rot{color:var(--red)}
.t-mx tr.mx-op td{font-size:11.5px;color:var(--ink-2)}
.t-mx tfoot td{background:var(--soft)}
.t-mx tfoot td.mx-q{background:#DDEBD3}
.mx-xls{font-size:12px;padding:5px 10px}
.cx-com{flex:1 1 320px}
.cx-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cx-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;background:#fff;white-space:nowrap}
.cx-chip.on{border-color:var(--ink);background:var(--soft);font-weight:700}
.cx-chip.eb{opacity:.55;cursor:default}
.cx-todos{font-size:12px;padding:5px 11px}
.cx-met{display:flex;align-items:center;gap:6px}
.g-var-b + .g-var-b{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.g-var-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px}
.sh-faixa{background:#EEF4FB;border:1px solid #CFE0F3;color:#1E4E86;border-radius:12px;padding:8px 12px;font-size:12.5px;margin:14px 0 0}
.dlg-f textarea{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--ink);resize:vertical}
.dlg-f label.dlg-chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.dlg-f label.dlg-chk input{border:0;padding:0}
.dlg-r{flex-wrap:wrap}
.tw15{overflow:auto;border:1px solid var(--line);border-radius:12px;scrollbar-width:auto;scrollbar-color:#B8BEC2 var(--soft)}
.tw15::-webkit-scrollbar{width:12px;height:12px}
.tw15::-webkit-scrollbar-track{background:var(--soft)}
.tw15::-webkit-scrollbar-thumb{background:#B8BEC2;border-radius:8px;border:3px solid var(--soft)}
.tw15::-webkit-scrollbar-thumb:hover{background:#8A9095}
.tw15::-webkit-scrollbar-corner{background:var(--soft)}
.tw15 > table > thead{position:sticky;top:0;z-index:3}
.tw15 > table > tfoot{position:sticky;bottom:0;z-index:3}
.tw15 > table > tfoot td{background:#fff;box-shadow:0 -1px 0 var(--line-2)}
.tw15 > .t-mx > tfoot td{background:var(--soft)}
.tw15 > .t-mx > tfoot td.mx-q{background:#DDEBD3}
.tw15 > .t-mx > tfoot td.mx-t{background:#F1F2F3}
.t-ppu td.ppu-proj{font-weight:700}
.tf-h{display:inline-flex;align-items:center;gap:3px}
th.n .tf-h{justify-content:flex-end;width:100%}
.tf-s{border:0;background:transparent;padding:0;margin:0;font:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tf-s:hover{color:var(--ink)}
.tf-ar{font-style:normal;font-size:9px;color:#B8BEC2;letter-spacing:0}
th.tf-on .tf-s{color:var(--ink)}
th.tf-on .tf-ar{color:var(--red);font-size:10px}
.tf-b{border:1px solid transparent;background:transparent;border-radius:6px;width:20px;height:20px;cursor:pointer;color:var(--ink-3);font-size:11px;line-height:1;padding:0;flex:none}
.tf-b:hover{border-color:var(--line-2);background:#fff;color:var(--ink)}
.tf-b.on{background:var(--red);border-color:var(--red);color:#fff}
.tf-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:4px 0 8px}
.tf-clr{font-size:12px;padding:4px 10px}
.tf-pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:10px;width:310px;max-width:calc(100vw - 16px);font-size:13px}
.tf-pt{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 2px 8px}
.tf-po{display:flex;gap:6px;margin-bottom:8px}
.tf-po .btn-o{flex:1;font-size:12px;padding:5px 8px}
.tf-q{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:6px 9px;margin-bottom:6px}
.tf-all{display:flex;align-items:center;gap:6px;padding:4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink-2)}
.tf-list{max-height:240px;overflow-y:auto;margin:4px 0 8px}
.tf-it{display:flex;align-items:center;gap:4px;padding:0 4px;border-radius:8px}
.tf-it:hover{background:var(--soft)}
.tf-it label{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer;padding:4px 0}
.tf-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf-it em{font-style:normal;color:var(--ink-3);font-size:11.5px;margin-left:auto;padding-left:6px}
.tf-so{border:0;background:transparent;color:var(--red-dk);font-size:11.5px;font-weight:700;cursor:pointer;padding:3px 5px;border-radius:6px;white-space:nowrap;opacity:.45}
.tf-it:hover .tf-so,.tf-so:focus{opacity:1}
.tf-so:hover{background:#FBEFEF}
.tf-pr{display:flex;align-items:center;gap:6px}
.tf-pr .btn-o,.tf-pr .btn-r{font-size:12px;padding:5px 10px}
.g-bar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.g-mets button{font-size:12px;padding:5px 10px}
.cx-btn{font-size:12.5px;padding:6px 12px}
.cx-sel{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.cx-sel-l{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.cx-sel .f select{max-width:280px}
.cx-inv{padding:6px 12px;font-size:14px}
.cx-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.cx-k em.cx-d{font-weight:700}
.cx-k em.cv-bom{color:#2E7D32}
.cx-k em.cv-ruim{color:var(--red)}
.cx-k em.cv-novo{color:#2a78d6}
.cx-k.cx-sel-on{border-color:var(--ink-3)}
.cv-bom{color:#2E7D32}
.cv-ruim{color:var(--red)}
.cv-0{color:var(--ink-3)}
.cv-novo{color:#2a78d6;font-weight:700}
.t-mx td.cx-p{font-size:11.5px;font-weight:600;padding-left:2px}
.t-mx td.cx-p.cv-bom{color:#2E7D32}
.t-mx td.cx-p.cv-ruim{color:var(--red)}
.t-mx td.mx-t.cv-bom{color:#2E7D32}
.t-mx td.mx-t.cv-ruim{color:var(--red)}
.t-cx tr.cx-nova td.mx-rot{border-left:3px solid #2a78d6}
.t-cx tr.cx-rem td.mx-rot{border-left:3px solid var(--red)}
.t-cx tr.cx-rem td{color:var(--ink-3)}
.cx-mud{margin-left:8px}
.t-regs td{white-space:nowrap}
.g-pl{font-size:10.5px;font-weight:700;text-anchor:middle;fill:var(--ink-2)}
.g-pl.cv-bom{fill:#2E7D32}
.g-pl.cv-ruim{fill:var(--red)}
.g-pl.cv-novo{fill:#2a78d6}
.g-pl.cv-0{fill:var(--ink-3)}
.g-papel .g-bg{fill:#F6F7F8}
.g-papel-t{font-weight:700;fill:var(--ink-2)}
.ovl{position:fixed;inset:0;background:rgba(20,23,24,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:20px 22px;width:min(520px,100%)}
.dlg h3{margin:0 0 6px;font-size:18px;font-weight:600}
.dlg-f{display:flex;flex-direction:column;gap:10px;margin:12px 0 8px}
.dlg-f label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.dlg-f input{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.dlg-r{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.reg-aviso:empty{display:none}
.b-reg{white-space:nowrap}
.qcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:2px 0 12px}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:stretch}
.qc{border-width:1px;transition:border-color .12s,box-shadow .12s}
.qc:hover{border-color:var(--ink-3)}
.qc span i{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.qc.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(204,0,0,.18)}
.qc.dest span i{color:rgba(255,255,255,.8)}

<script>
/* EARL Gerencial — junta os arquivos "Arquivo do gerencial" gerados pelos engenheiros no EARL Engenharia
   (formato {tipo:'EARL-Gerencial', formato:2 (ou 1), geradoEm, por, contratos[], operacoes[]}) e mostra o consolidado.
   Para cada contrato vale o arquivo mais novo. Tudo fica neste navegador (localStorage, prefixo earlger:). */
(function () {
  'use strict';
  var VERSAO = 'EARL Gerencial g16';
  var CHAVE = 'earlger:pacotes_v1';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var nf = function (min, max) { return function (v) { return v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits: min, maximumFractionDigits: max}); }; };
  var fN = nf(0, 2);
  var fBRL = function (v) { return v == null || !isFinite(v) ? '—' : 'R$ ' + nf(2, 2)(v); };
  var fUSD = function (v) { return v == null || !isFinite(v) ? '—' : 'US$ ' + nf(2, 2)(v); };
  // g16: número dos cards com o "US$" pequeno na frente (o texto continua "US$ 1.234,56")
  var bUSD = function (v) { var t = fUSD(v); return t.indexOf('US$ ') === 0 ? '<small class="u">US$</small> ' + t.slice(4) : t; };
  var fD = function (s) { if (!s) return '—'; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[3] + '/' + m[2] + '/' + m[1] : s; };
  var fDH = function (iso) { if (!iso) return '—'; var d = new Date(iso); if (isNaN(d)) return iso; var p = function (n) { return String(n).padStart(2, '0'); }; return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var fMes = function (k) { var a = String(k).split('-'); return MESES[Number(a[1]) - 1] + '/' + a[0]; };
  var hojeTxt = function () { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
  var r4 = function (v) { return Math.round(v * 10000) / 10000; };

  var S = {pacotes: [], tab: 'receita', f: {ano: '', qIni: 0, qFim: 0, mIni: 0, mFim: 0, cliente: '', contrato: '', regiao: '', tipo: '', busca: ''}, soComConsumo: true, msg: null, graf: true, tend: 'linear', gmodo: 'mes', mx: {abertos: {}, mostrar: 1}, mesPop: false, mesPasso: 0, qPop: false, qPasso: 0, mxVer: null, gmet: 'ambos', regs: [], cmp: {base: null, sel: [], abertos: {}, mostrar: 1, soMud: false}, tf: {}};
  try { S.pacotes = JSON.parse(localStorage.getItem(CHAVE) || '[]') || []; } catch (e) { S.pacotes = []; }
  /* modo embutido: a seção "Receita e margem" dentro da página inicial do EARL Engenharia (iframe). Os dados vêm da
     Engenharia (window.parent.engGerDados()), nada de arquivos, registros nem abas; as preferências (gráfico etc.) ficam
     com o prefixo earleng:ger: para não misturar com o Gerencial aberto do disco. */
  var EMB = (function () { try { var e = document.getElementById('earlger-embutido'); return e ? JSON.parse(e.textContent) || {} : null; } catch (e) { return null; } })();
  if (EMB) { try { if (!window.XLSX && window.parent && window.parent !== window) window.XLSX = window.parent.XLSX; } catch (e) {} document.documentElement.classList.add('emb'); }
  var PREF_EMB = (function () { try { return ((window.parent.EARL_ARMAZ || {}).P || 'earleng:') + 'ger:'; } catch (e) { return 'earleng:ger:'; } })(); // o mesmo prefixo do arquivo da Engenharia (earleng: ou earlengbp:)
  var CHV = function (k) { return (EMB ? PREF_EMB : 'earlger:') + k; };
  try { var t0 = localStorage.getItem(CHV('tab')); if (t0) S.tab = t0 === 'matriz' ? 'receita' : t0; } catch (e) {}
  try { if (localStorage.getItem(CHV('graf')) === 'oculto') S.graf = false; var t1 = localStorage.getItem(CHV('tend')); if (t1 === 'linear' || t1 === 'mm3' || t1 === 'nenhuma') S.tend = t1; var t2 = localStorage.getItem(CHV('gmodo')); if (t2 === 'mes' || t2 === 'mescli' || t2 === 'cli') S.gmodo = t2; var t3 = localStorage.getItem(CHV('gmet')); if (t3 === 'rec' || t3 === 'cogs' || t3 === 'ambos' || t3 === 'mg') S.gmet = t3; } catch (e) {}
  /* versão compartilhada: os dados vêm de dentro do arquivo (#earlger-dados) e nada é gravado no navegador */
  var DADOS_EMB = (function () { try { var de = document.getElementById('earlger-dados'); return de ? JSON.parse(de.textContent) : null; } catch (e) { return null; } })();
  var COMPARTILHADO = !!(DADOS_EMB && DADOS_EMB.tipo === 'EARL-Gerencial-Compartilhado' && Array.isArray(DADOS_EMB.pacotes));
  if (COMPARTILHADO) S.pacotes = DADOS_EMB.pacotes;
  var gravar = function () {
    if (COMPARTILHADO || EMB) return true;
    try { localStorage.setItem(CHAVE, JSON.stringify(S.pacotes)); return true; }
    catch (e) { aviso('O navegador não deixou guardar os arquivos (armazenamento cheio). Eles valem até fechar a página.', true); return false; }
  };
  var tmsg = null;
  var aviso = function (txt, erro) {
    S.msg = {txt: txt, erro: !!erro};
    var el = $('#msg'); if (!el) { el = document.createElement('div'); el.id = 'msg'; document.body.appendChild(el); }
    el.className = 'msg' + (erro ? ' err' : ''); el.textContent = txt; el.style.display = '';
    clearTimeout(tmsg); tmsg = setTimeout(function () { el.style.display = 'none'; }, erro ? 9000 : 5000);
  };

  /* ---------- leitura dos arquivos ---------- */
  var lerTexto = function (f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result || '')); }; r.onerror = function () { rej(r.error); }; r.readAsText(f); }); };
  var lerBuf = function (f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; r.readAsArrayBuffer(f); }); };
  var ehPacote = function (j) { return j && j.tipo === 'EARL-Gerencial' && Array.isArray(j.contratos) && Array.isArray(j.operacoes); };
  var assinatura = function (p) { return [p.geradoEm, p.por, (p.contratos || []).map(function (c) { return c.id; }).sort().join(',')].join('|'); };
  var acrescentar = function (lista) {
    var novos = 0, repetidos = 0;
    lista.forEach(function (x) {
      var sig = assinatura(x.pac);
      if (S.pacotes.some(function (p) { return assinatura(p.pac) === sig; })) { repetidos++; return; }
      S.pacotes.push({arquivo: x.arquivo, carregadoEm: new Date().toISOString(), pac: x.pac}); novos++;
    });
    return {novos: novos, repetidos: repetidos};
  };
  var processar = async function (files) {
    if (COMPARTILHADO) return;
    var achados = [], ignorados = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i], nome = f.webkitRelativePath || f.name || '';
      try {
        if (/\.zip$/i.test(nome)) {
          var zip = await JSZip.loadAsync(await lerBuf(f));
          var nomes = Object.keys(zip.files).filter(function (n) { return /\.json$/i.test(n) && !zip.files[n].dir; });
          for (var k = 0; k < nomes.length; k++) {
            try { var j = JSON.parse(await zip.files[nomes[k]].async('string')); if (ehPacote(j)) achados.push({arquivo: nome + ' › ' + nomes[k], pac: j}); else ignorados.push(nomes[k]); }
            catch (e) { ignorados.push(nomes[k]); }
          }
        } else if (/\.json$/i.test(nome)) {
          var j2 = JSON.parse(await lerTexto(f));
          if (ehPacote(j2)) achados.push({arquivo: nome, pac: j2}); else ignorados.push(nome);
        }
      } catch (e) { ignorados.push(nome); }
    }
    var r = acrescentar(achados);
    gravar();
    render();
    var partes = [r.novos + ' arquivo(s) carregado(s)'];
    if (r.repetidos) partes.push(r.repetidos + ' já estavam carregados');
    if (ignorados.length) partes.push(ignorados.length + ' ignorado(s) — não são “Arquivo do gerencial”: ' + ignorados.slice(0, 3).join(', ') + (ignorados.length > 3 ? '…' : ''));
    aviso(partes.join(' · '), !achados.length);
  };
  var lerEntrada = function (entry, acc) {
    return new Promise(function (res) {
      if (entry.isFile) entry.file(function (f) { acc.push(f); res(); }, function () { res(); });
      else if (entry.isDirectory) {
        var rd = entry.createReader(), todas = [];
        var ler = function () { rd.readEntries(function (es) { if (!es.length) { Promise.all(todas.map(function (e) { return lerEntrada(e, acc); })).then(res); } else { todas = todas.concat(Array.from(es)); ler(); } }, function () { res(); }); };
        ler();
      } else res();
    });
  };

  /* ---------- consolidação ---------- */
  var consolidar = function () {
    var porCt = {};
    S.pacotes.forEach(function (p, ip) {
      (p.pac.contratos || []).forEach(function (c) {
        var a = porCt[c.id];
        if (!a || String(p.pac.geradoEm || '') > String(S.pacotes[a.ip].pac.geradoEm || '')) porCt[c.id] = {ip: ip, ct: c};
      });
    });
    var contratos = [], ops = [];
    Object.keys(porCt).forEach(function (id) {
      var x = porCt[id], p = S.pacotes[x.ip];
      contratos.push(Object.assign({}, x.ct, {_fonte: p.arquivo, _gerado: p.pac.geradoEm, _por: p.pac.por || ''}));
      (p.pac.operacoes || []).filter(function (o) { return o.contratoId === id; }).forEach(function (o) { ops.push(Object.assign({}, o, {_ct: x.ct})); });
    });
    contratos.sort(function (a, b) { return String(a.cliente).localeCompare(String(b.cliente), 'pt') || String(a.nome).localeCompare(String(b.nome), 'pt'); });
    var uso = S.pacotes.map(function (p, ip) {
      var ids = (p.pac.contratos || []).map(function (c) { return c.id; });
      var usados = ids.filter(function (id) { return porCt[id] && porCt[id].ip === ip; });
      return {usados: usados.length, total: ids.length};
    });
    return {contratos: contratos, ops: ops, uso: uso};
  };
  var filtrar = function (C, soAno) {
    var f = S.f;
    var ctOk = function (c) {
      return (!f.cliente || c.cliente === f.cliente) && (!f.contrato || c.id === f.contrato) && (!f.regiao || c.regiao === f.regiao) && (!f.tipo || c.tipo === f.tipo);
    };
    var cts = C.contratos.filter(ctOk);
    var ids = {}; cts.forEach(function (c) { ids[c.id] = 1; });
    var ops = C.ops.filter(function (o) { return ids[o.contratoId]; });
    var noPer = function (d) { return periodoOk(d, soAno); };
    return {cts: cts, ops: ops, noPer: noPer};
  };
  // um ano por vez; o quarto vale no lugar dos meses; soAno = sem quarto/mês (cards dos quartos)
  var periodoOk = function (d, soAno) {
    var f = S.f, m = String(d || '').slice(0, 7), mo = Number(m.slice(5, 7));
    if (f.ano && m.slice(0, 4) !== f.ano) return false;
    if (soAno) return true;
    if (f.qIni) { var q = triDe(m); return q >= f.qIni && q <= f.qFim; }
    return !f.mIni || (mo >= f.mIni && mo <= f.mFim);
  };
  var triDe = function (m) { return Math.floor((Number(String(m).slice(5, 7)) - 1) / 3) + 1; };
  var dataOp = function (o) { return o.realizado ? o.realizado.data : o.data; };
  var anosDe = function (C) { return C.ops.map(function (o) { return String(dataOp(o) || '').slice(0, 4); }).filter(function (a, i, l) { return /^\d{4}$/.test(a) && l.indexOf(a) === i; }).sort(); };
  // ano padrão: o ano de hoje, se houver operação nele; senão, o mais recente
  var anoPadrao = function (anos) { var h = String(new Date().getFullYear()); return anos.indexOf(h) >= 0 ? h : anos[anos.length - 1] || ''; };
  /* Risco da operação (0–100%): receita e COGS contam × (1 − risco). Com 100% a operação aparece, mas fica fora. */
  var fatorOp = function (o) { var r = Number(o.risco) || 0; return r > 0 ? Math.max(0, 1 - Math.min(100, r) / 100) : 1; };
  /* g16: linha prevista em contingência (item PPU, química, casing) traz o seu risco de não acontecer: conta × (1 − risco).
     O total previsto da operação (previsto.receita / previsto.cogs) já vem com ele no arquivo. */
  var fLin = function (l) { var r = Number(l && l.risco) || 0; return r > 0 ? Math.max(0, 1 - Math.min(100, r) / 100) : 1; };
  var precoItem = function (o, ref) { return (o._ct.itens || []).find(function (x) { return x.ref === ref; }) || {}; };
  var prevRec = function (o) {
    var p = o.previsto || {};
    if (p.receita) return {b: p.receita.brl || 0, u: p.receita.usd || 0};
    var b = 0, u = 0; // arquivo do formato 1: valoriza pelo valor vigente do contrato
    (p.ppu || []).forEach(function (l) { var i = precoItem(o, l.ref); if (i.brl != null) b += (l.qtd || 0) * i.brl; if (i.usd != null) u += (l.qtd || 0) * i.usd; });
    return {b: b, u: u};
