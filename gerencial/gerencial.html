<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EARL — Gerencial</title>
<style>
:root{--red:#CC0000;--red-dk:#961B24;--ink:#2A2F30;--ink-2:#4D545A;--ink-3:#6B7378;--line:#E2E5E7;--line-2:#D4DADD;--bg:#ECEFF0;--card:#fff;--soft:#F4F5F6;--ok:#304220;--ok-bg:#F1F5EC;--warn:#6B4E0E;--warn-bg:#FBF4E4}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Univers","Helvetica Neue",Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hdr{background:var(--red);color:#fff;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px}
.hdr img{height:30px;display:block}
.hdr .rule{width:1px;height:34px;background:rgba(255,255,255,.55)}
.hdr .tit{font-size:16px;font-weight:300;letter-spacing:.04em;white-space:nowrap}
.hdr .sp{flex:1}
.hdr .ver{font-size:11px;opacity:.85;white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 40px}
.bar{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bar .info{font-size:12.5px;color:var(--ink-2)}
.sp{flex:1}
.btn-r,.btn-o{border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{background:#B92031}
.btn-o{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn-o:hover{border-color:var(--ink-3)}
.btn-r:disabled,.btn-o:disabled{opacity:.5;cursor:default}
.btn-x{border:1px solid var(--line-2);background:#fff;border-radius:999px;width:26px;height:26px;cursor:pointer;font-weight:700;line-height:1}
h1{font-size:40px;font-weight:300;margin:26px 0 2px;position:relative;padding-left:4px}
h1:before{content:"";position:absolute;left:-22px;top:-12px;width:18px;height:18px;border-left:3px solid var(--red);border-top:3px solid var(--red)}
.sub{color:var(--ink-2);margin:0 0 16px}
.drop{border:2px dashed var(--line-2);border-radius:20px;background:#fff;padding:34px 20px;text-align:center;color:var(--ink-2);margin-top:14px}
.drop.on{border-color:var(--red);background:#FFF7F7}
.drop b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.drop ol{text-align:left;display:inline-block;margin:12px auto 0;font-size:13px;line-height:1.7}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:14px 0 6px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select{border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;background:#fff;min-width:0}
.f select{max-width:240px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.kpi{container-type:inline-size}
.kpi b{font-size:22px;font-size:min(22px,10.5cqi);font-weight:600;white-space:nowrap}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-2)}
.kpi.dest{background:linear-gradient(150deg,#D71F34 0%,#CC0000 46%,#961B24 100%);border-color:transparent;color:#fff}
.kpi.dest span,.kpi.dest em{color:rgba(255,255,255,.85)}
.tabs{display:flex;gap:2px;background:rgba(42,47,48,.06);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.card{background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);background:var(--soft);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line-2)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#FAFBFB}
.barra{height:8px;border-radius:999px;background:#E8EAEC;overflow:hidden;min-width:70px}
.barra i{display:block;height:100%;border-radius:999px;background:#43494E}
.barra i.r{background:var(--red)}
.pct{display:flex;align-items:center;gap:8px}
.pct span{font-size:11.5px;white-space:nowrap}
.neg{color:var(--red);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-ho{background:var(--warn-bg);color:var(--warn)}
.t-pl{background:var(--soft);color:var(--ink-2)}
.t-old{background:#FBEFEF;color:var(--red-dk)}
.vazio{color:var(--ink-3);font-style:italic;padding:8px 0}
.aviso{background:var(--warn-bg);border:1px solid #EEDDB4;color:var(--warn);border-radius:12px;padding:8px 12px;font-size:12.5px;margin:8px 0}
.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;z-index:50;max-width:92vw}
.msg.err{background:var(--red)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer}
details.ajuda{margin-top:10px;font-size:13px;color:var(--ink-2)}
details.ajuda summary{cursor:pointer;font-weight:700;color:var(--ink)}
.t-ops td{white-space:nowrap}
.sub2{font-size:11px;color:var(--ink-3);font-weight:400}
.nota{font-size:12px;color:var(--ink-3);margin:8px 0 0}
tr.fora td{color:var(--ink-3)}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.card-h h2{margin:0;flex:1}
.vis-tg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.vis-tg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.vis-tg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.g-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:2px 0 8px}
.g-leg span{display:inline-flex;align-items:center;gap:6px}
.g-leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.graf{position:relative;min-height:310px}
.g-svg{display:block;overflow:visible}
.g-grade{stroke:var(--line);stroke-width:1}
.g-grade.base{stroke:var(--line-2)}
.g-ty{font-size:11px;fill:var(--ink-3);text-anchor:end}
.g-un{font-weight:700}
.g-tx{font-size:11px;fill:var(--ink-3);text-anchor:middle}
.g-mes{cursor:pointer;outline:none}
.g-bg{fill:transparent}
.g-mes:hover .g-bg,.g-mes:focus .g-bg{fill:#F1F2F3}
.g-mes:focus-visible .g-bg{stroke:var(--ink-3);stroke-width:1}
.g-tip{position:absolute;display:none;pointer-events:none;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:200px;z-index:5}
.g-tt{font-weight:700;margin-bottom:4px;color:var(--ink)}
.g-tl{display:flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.7}
.g-tl i{width:12px;height:2px;border-radius:1px;display:inline-block}
.g-tl b{color:var(--ink)}
.g-tl span{color:var(--ink-3)}
.dd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px}
.dd-l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.dd-niv{display:inline-flex;align-items:center;gap:2px}
.dd-sel{border:1px solid var(--line-2);border-radius:10px;padding:6px 8px;background:#fff;font:inherit;font-size:13px}
.dd-seta{color:var(--ink-3);font-weight:700}
.dd-fim{font-size:13px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:10px;padding:5px 9px}
.dd-ate{display:inline-flex;gap:4px;flex-wrap:wrap}
.dd-ate .btn-o,.dd-add{font-size:12px;padding:5px 10px}
.t-dd tr.dd-g{cursor:pointer}
.t-dd tr.dd-g:hover td{background:#FAFBFB}
.t-dd tr.dd-g td:first-child{font-weight:600;white-space:nowrap}
.t-dd tr.dd-n0 td{background:#F6F7F8}
.t-dd tr.dd-n0:hover td{background:#EEF0F1}
.t-dd tr.dd-g.on td:first-child{color:var(--acc,#CC0000)}
.dd-tw{display:inline-block;width:16px;color:var(--ink-3);font-size:11px}
.t-dd tr.dd-op td{font-size:12.5px}
.t-dd tr.dd-op td:first-child{white-space:normal;min-width:260px}
tr.fora td b{color:var(--ink-3)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.hdr{gap:10px;padding:0 12px}.hdr img{height:24px}.hdr .ver{display:none}h1{font-size:30px;padding-left:22px}h1:before{left:0;top:-6px}.f select{max-width:100%}.f{flex:1 1 140px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:min(17px,10.5cqi)}.kpi em{font-size:11px}}
@media print{.bar,.tabs,.filtros{display:none}}
</style>
</head>
<body>
<div class="hdr"><img src="__LOGO_HAL__" alt="Halliburton"><div class="rule"></div><img src="__LOGO_EARL__" alt="EARL"><div class="tit">Gerencial</div><div class="sp"></div><div class="ver" id="ver"></div></div>
<div class="wrap" id="app"></div>
<input type="file" id="inArq" accept=".json,.zip,application/json,application/zip" multiple hidden>
<input type="file" id="inPasta" webkitdirectory multiple hidden>
<script>/*__LIB_XLSX__*/</script>
<script>/*__LIB_JSZIP__*/</script>
<script>
/* EARL Gerencial — junta os arquivos "Arquivo do gerencial" gerados pelos engenheiros no EARL Engenharia
   (formato {tipo:'EARL-Gerencial', formato:2 (ou 1), geradoEm, por, contratos[], operacoes[]}) e mostra o consolidado.
   Para cada contrato vale o arquivo mais novo. Tudo fica neste navegador (localStorage, prefixo earlger:). */
(function () {
  'use strict';
  var VERSAO = 'EARL Gerencial g4';
  var CHAVE = 'earlger:pacotes_v1';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var nf = function (min, max) { return function (v) { return v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits: min, maximumFractionDigits: max}); }; };
  var fN = nf(0, 2);
  var fBRL = function (v) { return v == null || !isFinite(v) ? '—' : 'R$ ' + nf(2, 2)(v); };
  var fUSD = function (v) { return v == null || !isFinite(v) ? '—' : 'US$ ' + nf(2, 2)(v); };
  var fD = function (s) { if (!s) return '—'; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[3] + '/' + m[2] + '/' + m[1] : s; };
  var fDH = function (iso) { if (!iso) return '—'; var d = new Date(iso); if (isNaN(d)) return iso; var p = function (n) { return String(n).padStart(2, '0'); }; return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var fMes = function (k) { var a = String(k).split('-'); return MESES[Number(a[1]) - 1] + '/' + a[0]; };
  var hojeTxt = function () { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
  var r4 = function (v) { return Math.round(v * 10000) / 10000; };

  var S = {pacotes: [], tab: 'receita', f: {de: '', ate: '', cliente: '', contrato: '', regiao: '', tipo: '', busca: ''}, soComConsumo: true, msg: null, drill: {niveis: ['mes', 'cliente', 'sonda'], abertos: {}, mostrar: null}, vis: 'tabela'};
  try { S.pacotes = JSON.parse(localStorage.getItem(CHAVE) || '[]') || []; } catch (e) { S.pacotes = []; }
  try { var t0 = localStorage.getItem('earlger:tab'); if (t0) S.tab = t0; } catch (e) {}
  try { if (localStorage.getItem('earlger:vis') === 'grafico') S.vis = 'grafico'; } catch (e) {}
  try { var n0 = JSON.parse(localStorage.getItem('earlger:drill') || 'null'); if (Array.isArray(n0) && n0.length) S.drill.niveis = n0; } catch (e) {}
  var gravar = function () {
    try { localStorage.setItem(CHAVE, JSON.stringify(S.pacotes)); return true; }
    catch (e) { aviso('O navegador não deixou guardar os arquivos (armazenamento cheio). Eles valem até fechar a página.', true); return false; }
  };
  var tmsg = null;
  var aviso = function (txt, erro) {
    S.msg = {txt: txt, erro: !!erro};
    var el = $('#msg'); if (!el) { el = document.createElement('div'); el.id = 'msg'; document.body.appendChild(el); }
    el.className = 'msg' + (erro ? ' err' : ''); el.textContent = txt; el.style.display = '';
    clearTimeout(tmsg); tmsg = setTimeout(function () { el.style.display = 'none'; }, erro ? 9000 : 5000);
  };

  /* ---------- leitura dos arquivos ---------- */
  var lerTexto = function (f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result || '')); }; r.onerror = function () { rej(r.error); }; r.readAsText(f); }); };
  var lerBuf = function (f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; r.readAsArrayBuffer(f); }); };
  var ehPacote = function (j) { return j && j.tipo === 'EARL-Gerencial' && Array.isArray(j.contratos) && Array.isArray(j.operacoes); };
  var assinatura = function (p) { return [p.geradoEm, p.por, (p.contratos || []).map(function (c) { return c.id; }).sort().join(',')].join('|'); };
  var acrescentar = function (lista) {
    var novos = 0, repetidos = 0;
    lista.forEach(function (x) {
      var sig = assinatura(x.pac);
      if (S.pacotes.some(function (p) { return assinatura(p.pac) === sig; })) { repetidos++; return; }
      S.pacotes.push({arquivo: x.arquivo, carregadoEm: new Date().toISOString(), pac: x.pac}); novos++;
    });
    return {novos: novos, repetidos: repetidos};
  };
  var processar = async function (files) {
    var achados = [], ignorados = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i], nome = f.webkitRelativePath || f.name || '';
      try {
        if (/\.zip$/i.test(nome)) {
          var zip = await JSZip.loadAsync(await lerBuf(f));
          var nomes = Object.keys(zip.files).filter(function (n) { return /\.json$/i.test(n) && !zip.files[n].dir; });
          for (var k = 0; k < nomes.length; k++) {
            try { var j = JSON.parse(await zip.files[nomes[k]].async('string')); if (ehPacote(j)) achados.push({arquivo: nome + ' › ' + nomes[k], pac: j}); else ignorados.push(nomes[k]); }
            catch (e) { ignorados.push(nomes[k]); }
          }
        } else if (/\.json$/i.test(nome)) {
          var j2 = JSON.parse(await lerTexto(f));
          if (ehPacote(j2)) achados.push({arquivo: nome, pac: j2}); else ignorados.push(nome);
        }
      } catch (e) { ignorados.push(nome); }
    }
    var r = acrescentar(achados);
    gravar();
    render();
    var partes = [r.novos + ' arquivo(s) carregado(s)'];
    if (r.repetidos) partes.push(r.repetidos + ' já estavam carregados');
    if (ignorados.length) partes.push(ignorados.length + ' ignorado(s) — não são “Arquivo do gerencial”: ' + ignorados.slice(0, 3).join(', ') + (ignorados.length > 3 ? '…' : ''));
    aviso(partes.join(' · '), !achados.length);
  };
  var lerEntrada = function (entry, acc) {
    return new Promise(function (res) {
      if (entry.isFile) entry.file(function (f) { acc.push(f); res(); }, function () { res(); });
      else if (entry.isDirectory) {
        var rd = entry.createReader(), todas = [];
        var ler = function () { rd.readEntries(function (es) { if (!es.length) { Promise.all(todas.map(function (e) { return lerEntrada(e, acc); })).then(res); } else { todas = todas.concat(Array.from(es)); ler(); } }, function () { res(); }); };
        ler();
      } else res();
    });
  };

  /* ---------- consolidação ---------- */
  var consolidar = function () {
    var porCt = {};
    S.pacotes.forEach(function (p, ip) {
      (p.pac.contratos || []).forEach(function (c) {
        var a = porCt[c.id];
        if (!a || String(p.pac.geradoEm || '') > String(S.pacotes[a.ip].pac.geradoEm || '')) porCt[c.id] = {ip: ip, ct: c};
      });
    });
    var contratos = [], ops = [];
    Object.keys(porCt).forEach(function (id) {
      var x = porCt[id], p = S.pacotes[x.ip];
      contratos.push(Object.assign({}, x.ct, {_fonte: p.arquivo, _gerado: p.pac.geradoEm, _por: p.pac.por || ''}));
      (p.pac.operacoes || []).filter(function (o) { return o.contratoId === id; }).forEach(function (o) { ops.push(Object.assign({}, o, {_ct: x.ct})); });
    });
    contratos.sort(function (a, b) { return String(a.cliente).localeCompare(String(b.cliente), 'pt') || String(a.nome).localeCompare(String(b.nome), 'pt'); });
    var uso = S.pacotes.map(function (p, ip) {
      var ids = (p.pac.contratos || []).map(function (c) { return c.id; });
      var usados = ids.filter(function (id) { return porCt[id] && porCt[id].ip === ip; });
      return {usados: usados.length, total: ids.length};
    });
    return {contratos: contratos, ops: ops, uso: uso};
  };
  var filtrar = function (C) {
    var f = S.f;
    var ctOk = function (c) {
      return (!f.cliente || c.cliente === f.cliente) && (!f.contrato || c.id === f.contrato) && (!f.regiao || c.regiao === f.regiao) && (!f.tipo || c.tipo === f.tipo);
    };
    var cts = C.contratos.filter(ctOk);
    var ids = {}; cts.forEach(function (c) { ids[c.id] = 1; });
    var ops = C.ops.filter(function (o) { return ids[o.contratoId]; });
    var noPer = function (d) { var m = String(d || '').slice(0, 7); return (!f.de || m >= f.de) && (!f.ate || m <= f.ate); };
    return {cts: cts, ops: ops, noPer: noPer};
  };
  /* Risco da operação (0–100%): receita e COGS contam × (1 − risco). Com 100% a operação aparece, mas fica fora. */
  var fatorOp = function (o) { var r = Number(o.risco) || 0; return r > 0 ? Math.max(0, 1 - Math.min(100, r) / 100) : 1; };
  var precoItem = function (o, ref) { return (o._ct.itens || []).find(function (x) { return x.ref === ref; }) || {}; };
  var prevRec = function (o) {
    var p = o.previsto || {};
    if (p.receita) return {b: p.receita.brl || 0, u: p.receita.usd || 0};
    var b = 0, u = 0; // arquivo do formato 1: valoriza pelo valor vigente do contrato
    (p.ppu || []).forEach(function (l) { var i = precoItem(o, l.ref); if (i.brl != null) b += (l.qtd || 0) * i.brl; if (i.usd != null) u += (l.qtd || 0) * i.usd; });
    return {b: b, u: u};
  };
  var cogsDe = function (c) { return {b: c ? c.brl || 0 : 0, u: c ? c.usd || 0 : 0}; };
  var hdDe = function (l) { return (l || []).reduce(function (a, p) { return a + (p.hd || 0); }, 0); };
  /* Valor de cada operação no período: realizada (consumo lançado, pela data do serviço) ou prevista
     (ainda sem consumo, pela data planejada) — como o "Total receita" da planilha de forecast. */
  var valorOp = function (o, F) {
    var f = fatorOp(o);
